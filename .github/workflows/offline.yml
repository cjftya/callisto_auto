name: Offline validation
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  pro-regression:
    runs-on: ubuntu-latest
    env:
      CALLISTO_FORBID_LIVE_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' wheel
      - run: python -m pytest
      - run: python -m pip wheel --no-deps --no-build-isolation -w dist .
      - run: python -m pip check
  adapter-portability:
    runs-on: windows-latest
    env:
      CALLISTO_FORBID_LIVE_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/callisto
