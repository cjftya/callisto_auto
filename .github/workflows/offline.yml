name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cli-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CALLISTO_FORBID_LIVE_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" wheel setuptools
      - name: Parse Windows bootstrap without running installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count) { throw ($Errors | Out-String) }
      - name: Full Pro regression (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest --junitxml=dist/tests.xml
      - name: CLI and process portability (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/callisto tests/unit/mcp tests/unit/runtime/test_helper_manager.py --junitxml=dist/tests.xml
      - run: python -m ruff check callisto tools tests/callisto
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --no-build-isolation -w dist .
      - name: Clean wheel installation and offline smoke test
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/callisto_auto-*.whl')
          subprocess.run([sys.executable, 'tools/verify_wheel.py', wheel, '--report', 'dist/wheel-report.json'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ runner.os }}-${{ github.sha }}
          path: dist/
  helper-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CALLISTO_FORBID_LIVE_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: python tools/build_helper.py
      - run: python -m pip install -e . wheel setuptools
      - name: Verify local Helper bundle without a device
        run: callisto helper bundle-status
      - name: Build wheel containing the verified Helper
        run: python -m pip wheel --no-deps --no-build-isolation -w dist .
      - name: Verify APK-bearing wheel in isolation
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/callisto_auto-*.whl')
          subprocess.run([sys.executable, 'tools/verify_wheel.py', wheel, '--report', 'dist/helper-wheel-report.json', '--require-helper'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: helper-dev-${{ runner.os }}-${{ github.sha }}
          path: |
            packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk
            packages/artemis-accessibility-helper/helper_manifest.json
            dist/
